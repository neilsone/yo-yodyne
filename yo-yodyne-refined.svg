<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!--
    Yo-Yodyne logo — refined, symmetric, golden-ratio proportioned.

    Golden ratio (φ ≈ 1.618):
    - Outer diamond: 80 wide × 80 tall (centered in 100×100)
    - Bar height: 80/φ² ≈ 30.5 → stroke band ~7.5 units
    - Center dot radius: 80/(φ⁴) ≈ 11.7 → r ≈ 4.8
    - Arm width (chevron thickness): ~7.5 units (matches bar height)

    Structure: diamond shape made of 4 elements:
    - Top horizontal bar (parallelogram)
    - Bottom horizontal bar (parallelogram, mirrored)
    - Left chevron arm
    - Right chevron arm (mirrored)
    - Center circle
  -->
  <g fill="#2d4a3e">
    <!-- Top bar -->
    <polygon points="30,14 70,14 64,24 36,24"/>
    <!-- Bottom bar -->
    <polygon points="36,76 64,76 70,86 30,86"/>
    <!-- Left arm -->
    <polygon points="28,16 36,16 18,50 36,84 28,84 4,50"/>
    <!-- Right arm -->
    <polygon points="64,16 72,16 96,50 72,84 64,84 82,50"/>
  </g>
  <!-- Center dot — golden ratio scaled -->
  <circle cx="50" cy="50" r="4.8" fill="#c4943d"/>
</svg>
