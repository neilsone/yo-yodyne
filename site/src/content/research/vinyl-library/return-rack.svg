<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" width="700" height="420">
  <defs>
    <pattern id="cream-bg" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#f5f1ea"/>
      <circle cx="1" cy="3" r="0.2" fill="#ece8df" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="700" height="420" fill="url(#cream-bg)"/>

  <!-- Title -->
  <text x="350" y="30" font-family="Georgia, serif" font-size="14" fill="#8a8378" text-anchor="middle" letter-spacing="3">EQUIPMENT KALLAX &#x2014; SESSION SUPPORT</text>

  <!-- Turntables on top -->
  <!-- Left turntable -->
  <rect x="80" y="45" width="150" height="100" rx="4" fill="#e8e2d6" stroke="#8a8378" stroke-width="1.5"/>
  <circle cx="155" cy="90" r="35" fill="none" stroke="#2c2c2c" stroke-width="1"/>
  <circle cx="155" cy="90" r="3" fill="#2c2c2c"/>
  <circle cx="155" cy="90" r="18" fill="none" stroke="#d4cfc7" stroke-width="0.5"/>
  <text x="155" y="138" font-family="Georgia, serif" font-size="9" fill="#8a8378" text-anchor="middle">Deck A</text>

  <!-- Right turntable -->
  <rect x="330" y="45" width="150" height="100" rx="4" fill="#e8e2d6" stroke="#8a8378" stroke-width="1.5"/>
  <circle cx="405" cy="90" r="35" fill="none" stroke="#2c2c2c" stroke-width="1"/>
  <circle cx="405" cy="90" r="3" fill="#2c2c2c"/>
  <circle cx="405" cy="90" r="18" fill="none" stroke="#d4cfc7" stroke-width="0.5"/>
  <text x="405" y="138" font-family="Georgia, serif" font-size="9" fill="#8a8378" text-anchor="middle">Deck B</text>

  <!-- Mixer between -->
  <rect x="245" y="55" width="70" height="80" rx="3" fill="#d4cfc7" stroke="#8a8378" stroke-width="1"/>
  <line x1="260" y1="70" x2="260" y2="120" stroke="#8a8378" stroke-width="1"/>
  <line x1="280" y1="65" x2="280" y2="125" stroke="#8a8378" stroke-width="1"/>
  <line x1="300" y1="75" x2="300" y2="115" stroke="#8a8378" stroke-width="1"/>
  <circle cx="260" cy="85" r="3" fill="#c4943d"/>
  <circle cx="280" cy="78" r="3" fill="#c4943d"/>
  <circle cx="300" cy="90" r="3" fill="#c4943d"/>

  <!-- Headphones hanging from edge -->
  <path d="M 500 55 Q 510 45 520 55 L 520 75" fill="none" stroke="#2c2c2c" stroke-width="2"/>
  <ellipse cx="500" cy="80" rx="6" ry="10" fill="#8a8378"/>
  <ellipse cx="520" cy="80" rx="6" ry="10" fill="#8a8378"/>

  <!-- Kallax cubbies row -->
  <rect x="60" y="160" width="540" height="130" rx="2" fill="none" stroke="#8a8378" stroke-width="1.5"/>

  <!-- Cubby dividers -->
  <line x1="240" y1="160" x2="240" y2="290" stroke="#8a8378" stroke-width="1.5"/>
  <line x1="420" y1="160" x2="420" y2="290" stroke="#8a8378" stroke-width="1.5"/>

  <!-- Deck A cubby - single record -->
  <rect x="110" y="175" width="8" height="100" rx="1" fill="#d4cfc7" stroke="#8a8378" stroke-width="0.75" transform="rotate(-2, 114, 225)"/>
  <circle cx="112" cy="190" r="3" fill="#2d4a3e" opacity="0.8"/>

  <!-- Deck B cubby - single record -->
  <rect x="310" y="175" width="8" height="100" rx="1" fill="#d4cfc7" stroke="#8a8378" stroke-width="0.75" transform="rotate(1, 314, 225)"/>
  <circle cx="312" cy="190" r="3" fill="#c4943d" opacity="0.8"/>

  <!-- Return rack cubby - multiple records at angles -->
  <rect x="445" y="178" width="8" height="95" rx="1" fill="#d4cfc7" stroke="#8a8378" stroke-width="0.75" transform="rotate(-8, 449, 225)"/>
  <rect x="458" y="175" width="8" height="98" rx="1" fill="#e0d9cd" stroke="#8a8378" stroke-width="0.75" transform="rotate(-4, 462, 224)"/>
  <rect x="471" y="177" width="8" height="96" rx="1" fill="#d4cfc7" stroke="#8a8378" stroke-width="0.75" transform="rotate(2, 475, 225)"/>
  <rect x="484" y="174" width="8" height="99" rx="1" fill="#e0d9cd" stroke="#8a8378" stroke-width="0.75" transform="rotate(-6, 488, 224)"/>
  <rect x="497" y="180" width="8" height="93" rx="1" fill="#d4cfc7" stroke="#8a8378" stroke-width="0.75" transform="rotate(5, 501, 226)"/>
  <rect x="510" y="176" width="8" height="97" rx="1" fill="#e0d9cd" stroke="#8a8378" stroke-width="0.75" transform="rotate(-3, 514, 225)"/>
  <!-- Some dots on return rack records -->
  <circle cx="447" cy="195" r="2.5" fill="#d44a4a" opacity="0.8"/>
  <circle cx="473" cy="193" r="2.5" fill="#4a7a9b" opacity="0.8"/>
  <circle cx="486" cy="190" r="2.5" fill="#2d4a3e" opacity="0.8"/>
  <circle cx="512" cy="192" r="2.5" fill="#c4943d" opacity="0.8"/>

  <!-- Labels -->
  <text x="150" y="310" font-family="Georgia, serif" font-size="12" fill="#2c2c2c" text-anchor="middle" font-style="italic">Deck A</text>
  <text x="150" y="325" font-family="Georgia, serif" font-size="9.5" fill="#8a8378" text-anchor="middle">now playing</text>

  <text x="330" y="310" font-family="Georgia, serif" font-size="12" fill="#2c2c2c" text-anchor="middle" font-style="italic">Deck B</text>
  <text x="330" y="325" font-family="Georgia, serif" font-size="9.5" fill="#8a8378" text-anchor="middle">now playing</text>

  <text x="510" y="310" font-family="Georgia, serif" font-size="12" fill="#2d4a3e" text-anchor="middle" font-style="italic" font-weight="bold">Return Rack</text>
  <text x="510" y="325" font-family="Georgia, serif" font-size="9.5" fill="#8a8378" text-anchor="middle">sort later</text>

  <!-- Flow arrows -->
  <path d="M 155 148 L 155 158" fill="none" stroke="#c4943d" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 405 148 L 405 158" fill="none" stroke="#c4943d" stroke-width="1.5"/>

  <!-- Arrow from decks to return rack -->
  <path d="M 200 225 C 280 200 350 340 460 310" fill="none" stroke="#c4943d" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="330" y="365" font-family="Georgia, serif" font-size="10" fill="#c4943d" text-anchor="middle" font-style="italic">played records land here</text>

  <!-- Bottom annotation -->
  <text x="350" y="400" font-family="Georgia, serif" font-size="11" fill="#8a8378" text-anchor="middle">The return rack decouples playing from re-shelving.</text>
</svg>