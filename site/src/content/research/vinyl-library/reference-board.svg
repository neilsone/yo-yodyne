<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" width="780" height="500">
  <defs>
    <pattern id="cream4" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#f5f1ea"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="780" height="500" fill="url(#cream4)"/>

  <!-- Board frame -->
  <rect x="30" y="20" width="720" height="440" rx="4" fill="#faf7f2" stroke="#8a8378" stroke-width="2"/>

  <!-- Board title -->
  <text x="390" y="55" font-family="Georgia, serif" font-size="16" fill="#2c2c2c" text-anchor="middle" letter-spacing="4" font-weight="bold">LIBRARY QUICK REFERENCE</text>
  <line x1="60" y1="68" x2="720" y2="68" stroke="#d4cfc7" stroke-width="1"/>

  <!-- === SECTION 1: Color Dot Legend === -->
  <text x="150" y="95" font-family="Georgia, serif" font-size="13" fill="#2c2c2c" text-anchor="middle" letter-spacing="2">GENRE / ENERGY</text>

  <!-- Dots with labels -->
  <circle cx="80" cy="125" r="8" fill="#d44a4a"/>
  <text x="98" y="129" font-family="Georgia, serif" font-size="11" fill="#2c2c2c">High energy / dancefloor</text>

  <circle cx="80" cy="155" r="8" fill="#4a7a9b"/>
  <text x="98" y="159" font-family="Georgia, serif" font-size="11" fill="#2c2c2c">Downtempo / ambient / chill</text>

  <circle cx="80" cy="185" r="8" fill="#2d4a3e"/>
  <text x="98" y="189" font-family="Georgia, serif" font-size="11" fill="#2c2c2c">Funk / soul / groove</text>

  <circle cx="80" cy="215" r="8" fill="#d4784a"/>
  <text x="98" y="219" font-family="Georgia, serif" font-size="11" fill="#2c2c2c">Pop / R&#x26;B</text>

  <circle cx="80" cy="245" r="8" fill="#d4c44a"/>
  <text x="98" y="249" font-family="Georgia, serif" font-size="11" fill="#2c2c2c">Electronic / house / synth</text>

  <circle cx="80" cy="275" r="8" fill="#2c2c2c"/>
  <text x="98" y="279" font-family="Georgia, serif" font-size="11" fill="#2c2c2c">Hip-hop / breaks / trip-hop</text>

  <circle cx="80" cy="305" r="8" fill="#e8e2d6" stroke="#8a8378" stroke-width="1"/>
  <text x="98" y="309" font-family="Georgia, serif" font-size="11" fill="#2c2c2c">Jazz / experimental</text>

  <circle cx="80" cy="335" r="8" fill="#7a5c8a"/>
  <text x="98" y="339" font-family="Georgia, serif" font-size="11" fill="#2c2c2c">Classical / soundtrack</text>

  <text x="150" y="370" font-family="Georgia, serif" font-size="9.5" fill="#8a8378" text-anchor="middle" font-style="italic">A record may have multiple dots</text>

  <!-- Vertical divider -->
  <line x1="280" y1="80" x2="280" y2="430" stroke="#d4cfc7" stroke-width="1"/>

  <!-- === SECTION 2: Sticker Guide === -->
  <text x="420" y="95" font-family="Georgia, serif" font-size="13" fill="#2c2c2c" text-anchor="middle" letter-spacing="2">STICKER GUIDE</text>

  <!-- Spine diagram -->
  <rect x="310" y="115" width="30" height="270" rx="2" fill="#e8e2d6" stroke="#8a8378" stroke-width="1"/>

  <!-- Opening at top -->
  <line x1="308" y1="115" x2="342" y2="115" stroke="#8a8378" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="325" y="110" font-family="Georgia, serif" font-size="8" fill="#8a8378" text-anchor="middle">opening</text>

  <!-- Top zone: resident crate sticker -->
  <rect x="313" y="135" width="24" height="30" rx="2" fill="#c4943d" opacity="0.8"/>

  <!-- Middle zone: genre dots -->
  <circle cx="320" cy="235" r="5" fill="#2d4a3e"/>
  <circle cx="332" cy="235" r="5" fill="#4a7a9b"/>

  <!-- Bottom zone: session tags -->
  <rect x="313" y="330" width="24" height="20" rx="2" fill="#2c2c2c"/>
  <circle cx="321" cy="340" r="2" fill="#d4878f"/>
  <circle cx="329" cy="340" r="2" fill="#d4878f"/>

  <!-- Annotations -->
  <line x1="345" y1="150" x2="365" y2="150" stroke="#8a8378" stroke-width="0.75"/>
  <text x="370" y="141" font-family="Georgia, serif" font-size="10" fill="#2c2c2c" font-weight="bold">TOP</text>
  <text x="370" y="153" font-family="Georgia, serif" font-size="9.5" fill="#8a8378">Resident crate</text>

  <line x1="345" y1="235" x2="365" y2="235" stroke="#8a8378" stroke-width="0.75"/>
  <text x="370" y="232" font-family="Georgia, serif" font-size="10" fill="#2c2c2c" font-weight="bold">MIDDLE</text>
  <text x="370" y="244" font-family="Georgia, serif" font-size="9.5" fill="#8a8378">Genre dots</text>

  <line x1="345" y1="340" x2="365" y2="340" stroke="#8a8378" stroke-width="0.75"/>
  <text x="370" y="332" font-family="Georgia, serif" font-size="10" fill="#2c2c2c" font-weight="bold">BOTTOM</text>
  <text x="370" y="344" font-family="Georgia, serif" font-size="9.5" fill="#8a8378">Session tags</text>
  <text x="370" y="356" font-family="Georgia, serif" font-size="9" fill="#8a8378" font-style="italic">(max 4 per record)</text>

  <!-- Routing rules -->
  <rect x="300" y="395" width="230" height="48" rx="3" fill="#2d4a3e" opacity="0.08"/>
  <text x="415" y="412" font-family="Georgia, serif" font-size="10" fill="#2d4a3e" text-anchor="middle" font-weight="bold">RESIDENT CRATE sticker = return to crate</text>
  <text x="415" y="428" font-family="Georgia, serif" font-size="10" fill="#2d4a3e" text-anchor="middle" font-weight="bold">No sticker = return to LIBRARY</text>

  <!-- Vertical divider -->
  <line x1="540" y1="80" x2="540" y2="430" stroke="#d4cfc7" stroke-width="1"/>

  <!-- === SECTION 3: Shelving Map === -->
  <text x="660" y="95" font-family="Georgia, serif" font-size="13" fill="#2c2c2c" text-anchor="middle" letter-spacing="2">SHELVING MAP</text>

  <!-- Kallax grid -->
  <rect x="580" y="115" width="160" height="250" rx="2" fill="none" stroke="#8a8378" stroke-width="1.5"/>

  <!-- Row dividers -->
  <line x1="580" y1="165" x2="740" y2="165" stroke="#8a8378" stroke-width="1"/>
  <line x1="580" y1="215" x2="740" y2="215" stroke="#8a8378" stroke-width="1"/>
  <line x1="580" y1="265" x2="740" y2="265" stroke="#8a8378" stroke-width="1"/>
  <line x1="580" y1="315" x2="740" y2="315" stroke="#8a8378" stroke-width="1"/>

  <!-- Row labels -->
  <rect x="585" y="120" width="150" height="40" rx="1" fill="#c4943d" opacity="0.12"/>
  <text x="660" y="144" font-family="Georgia, serif" font-size="10" fill="#c4943d" text-anchor="middle" font-weight="bold">RESIDENT CRATES</text>

  <rect x="585" y="170" width="150" height="40" rx="1" fill="#c4943d" opacity="0.12"/>
  <text x="660" y="194" font-family="Georgia, serif" font-size="10" fill="#c4943d" text-anchor="middle" font-weight="bold">RESIDENT CRATES</text>

  <rect x="585" y="220" width="150" height="40" rx="1" fill="#2d4a3e" opacity="0.08"/>
  <text x="660" y="244" font-family="Georgia, serif" font-size="10" fill="#2d4a3e" text-anchor="middle">LIBRARY  A ———</text>

  <rect x="585" y="270" width="150" height="40" rx="1" fill="#2d4a3e" opacity="0.08"/>
  <text x="660" y="294" font-family="Georgia, serif" font-size="10" fill="#2d4a3e" text-anchor="middle">LIBRARY  ——— Z</text>

  <rect x="585" y="320" width="150" height="40" rx="1" fill="#8a8378" opacity="0.08"/>
  <text x="660" y="344" font-family="Georgia, serif" font-size="10" fill="#8a8378" text-anchor="middle">QUARANTINE</text>

  <!-- Row numbers -->
  <text x="572" y="144" font-family="Georgia, serif" font-size="9" fill="#8a8378" text-anchor="end">1</text>
  <text x="572" y="194" font-family="Georgia, serif" font-size="9" fill="#8a8378" text-anchor="end">2</text>
  <text x="572" y="244" font-family="Georgia, serif" font-size="9" fill="#8a8378" text-anchor="end">3</text>
  <text x="572" y="294" font-family="Georgia, serif" font-size="9" fill="#8a8378" text-anchor="end">4</text>
  <text x="572" y="344" font-family="Georgia, serif" font-size="9" fill="#8a8378" text-anchor="end">5</text>

  <!-- Bottom note -->
  <rect x="555" y="385" width="190" height="50" rx="3" fill="none" stroke="#d4cfc7" stroke-width="1"/>
  <text x="650" y="404" font-family="Georgia, serif" font-size="10" fill="#2c2c2c" text-anchor="middle" font-style="italic">RETURN RACK</text>
  <text x="650" y="420" font-family="Georgia, serif" font-size="9.5" fill="#8a8378" text-anchor="middle">Put played records here.</text>
  <text x="650" y="432" font-family="Georgia, serif" font-size="9.5" fill="#8a8378" text-anchor="middle">We'll sort them later.</text>

</svg>